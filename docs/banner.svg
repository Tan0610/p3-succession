<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">The succession nobody wrote down</title>
<desc id="d">A shared Ladakh–Spiti manuscript catalogue that survives its steward, on Swarm. A string of prayer flags runs across the top. Below it, three custodians' seals on one thread (Ngawang, epoch 0; Padma, keeping it now; Stanzin, named next), seven library seals with the four that moved the register filled in, and a butter lamp under a thirty-day line.</desc>
